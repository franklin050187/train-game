name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: train
          POSTGRES_PASSWORD: train
          POSTGRES_DB: traingame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U train"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'postgresql://train:train@localhost:5432/traingame?sslmode=disable'
      SESSION_SECRET: 'ci-session-secret-do-not-use-in-prod'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'

      - name: E2E against production build
        run: npx playwright test
        env:
          USE_PRODUCTION_SERVER: '1'