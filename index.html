<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rail Run — Game Loop POC v3</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2b2722;
 background:
  radial-gradient(circle at 4% -4%, rgba(217,164,65,.16), transparent 240px),
  radial-gradient(circle at 97% 0%, rgba(47,110,90,.10), transparent 280px),
  linear-gradient(#f6f0e2,#eee5d0)}
.app{max-width:1080px;margin:auto;padding:18px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:16px;
 position:relative;border-bottom:3px double #d9a441}
.top:after{content:"";position:absolute;left:0;right:0;top:100%;height:3px;margin-top:1px;
 background:repeating-linear-gradient(90deg,#2f6e5a 0 12px,transparent 12px 16px);opacity:.55}
h1{font-size:30px;margin:0;color:#1f5240;letter-spacing:.5px}
h2{color:#2b2722}
h3,h4{color:#3d362a}
p{margin-top:0}
.money{font-size:24px;font-weight:800;color:#a4761a;background:#fff8e3;border:1px solid #e3cf96;padding:3px 16px;border-radius:24px}
.tabs{display:flex;gap:8px;margin:20px 0 14px}
.tab{flex:1;padding:12px;border:1px solid #dfd3b4;background:#f7f1e0;color:#6b624f;border-radius:12px;cursor:pointer;font-weight:700;transition:background .15s,color .15s}
.tab:hover{background:#fff7e2}
.tab.active{background:#2f6e5a;color:#fdf9ee;border-color:#1f5240;box-shadow:inset 0 3px 0 #d9a441,0 2px 6px rgba(47,110,90,.25)}
.panel{background:#fffdf6;border:1px solid #e0d5ba;border-radius:16px;padding:22px;min-height:520px;
 box-shadow:0 12px 32px rgba(94,74,32,.10);
 background-image:repeating-linear-gradient(0deg,rgba(217,164,65,.04) 0 1px,transparent 1px 15px)}
.panel.enter{animation:panelin .28s ease}
@keyframes panelin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fffdf5;border:1px solid #e7dcc0;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(94,74,32,.06)}
.card.sel{border-color:#d9a441;box-shadow:0 0 0 2px #d9a441 inset,0 1px 3px rgba(94,74,32,.06)}
button.action{width:100%;padding:12px;border:0;border-radius:10px;background:#2f6e5a;color:#fdf9ee;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #1f5240;font-size:15px}
button.action:hover{background:#387e68}
button.action:active{transform:translateY(2px);box-shadow:0 1px 0 #1f5240}
button.action.gold{background:#d9a441;color:#241a06;box-shadow:0 3px 0 #a4761a}
button.action.gold:hover{background:#e2b254}
button.action:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
button.small{padding:8px 14px;font-size:13px;margin-top:4px;width:auto;border-radius:8px;background:#efe8d4;border:1px solid #e0d5ba;color:#3d362a}
button.small:hover{background:#e7dec6}
.flowbtn{width:100%;padding:13px;border-radius:11px;border:1px solid #e0d5ba;background:#efe8d4;color:#3d362a;font-weight:800;cursor:pointer;font-size:15px}
.flowbtn:hover{background:#e7dec6}
.flowbtn.gold{background:#d9a441;color:#241a06;border-color:#c08c28;box-shadow:0 3px 0 #a4761a}
.flowbtn.gold:hover{background:#e2b254}
.flowbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.muted{color:#8a7f6b}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
.stat{background:#fffdf5;border:1px solid #e7dcc0;border-radius:9px;padding:9px 13px;font-size:14px;color:#3d362a}
.stat b{font-size:17px;color:#2b2722}
.rep-bar,.xpbar,.cbar{height:9px;background:#eee6d0;border-radius:5px;overflow:hidden;margin:6px 0;box-shadow:inset 0 1px 2px rgba(94,74,32,.15)}
.rep-bar .fill{height:100%;background:linear-gradient(90deg,#c08c28,#e0b24a);transition:width .3s}
.xpbar .fill{height:100%;background:linear-gradient(90deg,#3f7ed6,#7cb2f8)}
.result-xp{text-align:left;margin:16px 4px 2px;padding-top:4px;border-top:1px solid #eadfc2}
.result-xp .xp-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6b5f44}
.result-xp .xp-gain{font-weight:800;color:#2f7d43}
.result-xp .lvlup{display:inline-block;color:#fff;background:#2f7d43;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:800;margin-left:6px;animation:lvlpop 1s ease}
@keyframes lvlpop{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.xp-fill-anim{transition:width 1.1s cubic-bezier(.2,1.4,.4,1)}
.xp-max{color:#a4761a;font-weight:800}
.cbar .fill{height:100%;background:linear-gradient(90deg,#2f7d43,#67d17e)}
.rarity{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700;text-transform:uppercase;margin-right:6px}
.r-common{background:#e9e2cf;color:#5c5340}.r-uncommon{background:#dcefe3;color:#1f6b3d;border:1px solid #bfdcca}
.r-rare{background:#e2edfb;color:#2a63a8;border:1px solid #c3d9f0}.r-epic{background:#f0e3f6;color:#6b3f8f;border:1px solid #dcc8e8}.r-legendary{background:#fbe9d2;color:#a05e17;border:1px solid #f0d3a8}
.badge{display:inline-block;padding:3px 7px;border-radius:6px;background:#efe7d4;color:#5c5340;font-size:12px;font-weight:700}
.chip{display:inline-block;padding:3px 8px;border-radius:20px;background:#f2ead8;border:1px solid #e0d5ba;font-size:12px;margin-right:6px;margin-bottom:4px}
.route{position:relative;margin:38px 10px 44px;display:flex;justify-content:space-between}
.line{position:absolute;left:4%;right:4%;top:20px;height:6px;background:linear-gradient(#b8a97f,#998a63);border-radius:4px}
.city{position:relative;z-index:2;text-align:center;width:24%}
.dot{width:38px;height:38px;margin:auto;border-radius:50%;background:#fbf5e4;border:4px solid #a89c85;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(94,74,32,.15)}
.city.current .dot{border-color:#d9a441;background:#f7eccb}
.city.dest .dot{border-color:#2f7d43;background:#dcefe3}
.marker{position:absolute;z-index:3;font-size:18px;top:-16px;transform:translateX(-50%)}
.city-name{margin-top:8px;font-weight:800;font-size:13px;color:#3d362a}
.over-cap{background:#fbecea!important;border-color:#b6452e!important;opacity:.85}
.locked{background:#f3eaf6!important;border-color:#7a4a8a!important;opacity:.9}
.event{background:#fbf6e7;border:1px solid #e7dcc0;border-radius:12px;padding:16px;margin:14px 0}
.choices{display:grid;gap:8px;margin-top:10px}
@media(max-width:600px){.choices{grid-template-columns:1fr}}
.log{max-height:150px;overflow:auto;background:#f1ead7;border:1px solid #e0d5ba;padding:10px;border-radius:9px;font-size:13px;color:#4a4436}
.result-screen{background:#fdfaf0;border:1px solid #dcd0ae;border-radius:14px;padding:22px;text-align:center;margin:14px 0}
.result-screen.good{border-color:#2f7d43;background:#eef6e9}
.result-screen.bad{border-color:#b6452e;background:#fbf0eb}
.result-screen.result-in{animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
.result-screen .icon{font-size:46px}
.result-screen h2{font-size:26px;margin:6px 0 10px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:14px 0}
.detail{background:#fffdf5;border:1px solid #e7dcc0;padding:10px;border-radius:8px}
.detail .label{font-size:11px;color:#8a7f6b;text-transform:uppercase}
.detail .value{font-size:18px;font-weight:800;color:#2b2722}
.out-banner{border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:700}
.out-banner.good{background:#e2f0e5;border:1px solid #2f7d43}
.out-banner.loss{background:#f6e2dc;border:1px solid #b6452e}
.out-banner.calm{background:#f1ead7;border:1px solid #e0d5ba}
.risk{flex:1;padding:10px;border:1px solid #dfd3b4;background:#fffdf5;border-radius:10px;cursor:pointer;text-align:center;color:#3d362a}
.risk.sel{border-color:#d9a441;background:#fbf4df;box-shadow:0 0 0 1px #d9a441 inset}
.risk b{display:block;font-size:15px}
.goal{background:#fffdf5;border:1px solid #e7dcc0;border-radius:10px;padding:10px 12px;text-align:center}
.goal .lab{font-size:11px;color:#8a7f6b;text-transform:uppercase}
.goal .val{font-size:15px;font-weight:800}
.eng{background:#fffdf5;border:1px solid #e7dcc0;border-radius:12px;padding:14px}
.eng.own{border-color:#d9a441}
.eng.sel{border-color:#2f6e5a;background:#eef6e9;box-shadow:0 0 0 1px #2f6e5a inset}
.achrow{background:#fffdf5;border:1px solid #e7dcc0;border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.achrow.done{border-color:#2f7d43}
.achrow .val{font-weight:800;color:#a4761a;white-space:nowrap}
.hint{border:1px dashed #d9c68f;border-radius:10px;padding:10px 12px;background:#fbf6e7;font-size:13px;color:#6b624f;margin:10px 0}
.wagon-slot{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fffdf5;border:1px solid #e7dcc0;border-radius:8px;margin:4px 0;box-sizing:border-box}
.wagon-slot .remove{background:#b6452e;border:0;padding:4px 8px;border-radius:4px;color:#fff;cursor:pointer}
.newcity{animation:blink 1.6s ease-in-out infinite;font-weight:800;color:#a4761a}
@keyframes blink{50%{opacity:.35}}
.pixwin{display:block;image-rendering:pixelated;max-width:100%;height:auto;margin:12px auto}
.jscene{position:relative;margin:14px 0 2px;border:3px solid #c9a540;border-radius:14px;box-shadow:0 2px 10px rgba(94,74,32,.18),inset 0 0 0 2px #e7dcb6;overflow:hidden}
.jcan{width:100%;height:auto;display:block;image-rendering:pixelated;background:#0f1420;border:0;border-radius:10px}
.jcity{position:absolute;top:6px;font-size:11px;font-weight:800;color:#e9e2cc;z-index:3;background:rgba(20,26,36,.55);padding:1px 6px;border-radius:6px}
.jstart{left:6px}
.jend{right:6px}
.jbubble{position:absolute;top:0;transform:translateX(-50%);font-size:24px;z-index:5;animation:bounce .9s ease-in-out infinite;text-align:center;line-height:1}
.jbubble.done{animation:none;opacity:.9}
.jbubble .mark{display:block;font-size:10px;color:#f5d742}
@keyframes bounce{50%{transform:translateX(-50%) translateY(-7px)}}
.departing{text-align:center;font-weight:800;color:#a4761a;letter-spacing:.5px;animation:dp 1.7s ease-out both;font-size:16px}
@keyframes dp{0%{opacity:0;transform:translateY(10px)}18%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.runbanner{background:linear-gradient(180deg,#eef6e9,#fffdf6);border:1px solid #2f7d43;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 16px rgba(47,125,67,.12);animation:popin .4s ease}
.runbanner-title{font-size:19px;font-weight:800;color:#1f5240}
@media(max-width:760px){.grid,.grid2{grid-template-columns:1fr}.route{margin-top:22px}.top{flex-direction:column;align-items:flex-start;gap:8px}}
@media(max-width:600px){
  .app{padding:12px 10px 30px}
  h1{font-size:24px}
  h2{font-size:20px}
  h3{font-size:16px}
  .money{font-size:18px;padding:2px 10px}
  .tabs{gap:4px;margin:12px 0 10px}
  .tab{padding:8px 6px;font-size:11px}
  .panel{padding:14px;min-height:400px}
  .stat{padding:7px 10px;font-size:12px}
  .stat b{font-size:14px}
  .stats{gap:6px}
  .card{padding:10px}
  .wagon-slot{padding:6px 8px;font-size:12px}
  .wagon-slot .remove{padding:3px 6px;font-size:11px}
  button.action{padding:10px;font-size:14px}
  button.small{padding:6px 10px;font-size:12px}
  .flowbtn{padding:10px;font-size:13px}
  .risk{padding:8px;font-size:13px}
  .route{margin:20px 4px 30px}
  .city-name{font-size:11px}
  .dot{width:30px;height:30px}
  .line{height:4px;top:16px}
  .detail{padding:8px}
  .detail .value{font-size:15px}
  .result-screen{padding:16px}
  .result-screen h2{font-size:20px}
  .result-screen .icon{font-size:36px}
  .runbanner{padding:12px}
  .runbanner-title{font-size:16px}
  .log{max-height:120px;padding:8px;font-size:12px}
  .event{padding:12px}
  .hint{padding:8px 10px;font-size:12px}
  .jscene{margin:10px 0 2px}
  .jbubble{font-size:20px}
  .departing{font-size:14px}
}
@media(max-width:480px){
  .tab{padding:6px 4px;font-size:10px}
  .tabs{margin:8px 0 8px}
  .stat{padding:6px 8px;font-size:11px}
  .stat b{font-size:13px}
  .panel{padding:10px}
  .card{padding:8px}
  .wagon-slot{flex-wrap:wrap;gap:4px}
  .wagon-slot .remove{width:100%;margin-top:4px}
  .details{grid-template-columns:1fr}
  .achrow{flex-direction:column;align-items:flex-start;gap:4px}
  .achrow .val{font-size:13px}
  .city{width:20%}
  .dot{width:26px;height:26px}
  .city-name{font-size:10px}
}
.collapsible{margin:8px 0;border:1px solid #e7dcc0;border-radius:10px;background:#fffdf5;overflow:hidden}
.collapsible summary{cursor:pointer;padding:10px 12px;font-weight:700;color:#3d362a;list-style:none;display:flex;justify-content:space-between;align-items:center}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible summary:after{content:"▼";font-size:10px;color:#8a7f6b;transition:transform .2s}
.collapsible[open] summary:after{transform:rotate(180deg)}
.collapsible > div{padding:0 12px 12px}
@media(max-width:600px){.collapsible summary{padding:8px 10px;font-size:13px}.collapsible > div{padding:0 10px 10px}}
</style>
</head>

  g[y][col0+x]=ch==="b"?pa.b:ch==="B"?light(pa.b):ch==="k"?dark(pa.b):ch==="r"?pa.r:ch==="R"?light(pa.r):ch==="c"?pa.c:ch==="C"?dark(pa.c):CX[ch];});});};

 state.equip.forEach((id,k)=>put(V3_WAGF(id),k*16,PA[id]||PA.box));
 return {g,W,H};

let state=fresh();
try{const s=JSON.parse(localStorage.getItem("railrun_v3")||"null"); if(s) state=Object.assign(fresh(),s);}catch(e){}
// migrate owned from array to object
if(Array.isArray(state.owned)){
  const migrated={};
  state.owned.forEach(id=>migrated[id]=(migrated[id]||0)+1);
  state.owned=migrated;
}
state.owned=state.owned||{box:1};
state.equip=state.equip||["box"];
if(!state.ownedEngines||!state.ownedEngines.length) state.ownedEngines=[0];
if(state.engineIdx>=0&&state.ownedEngines.indexOf(state.engineIdx)<0) state.ownedEngines.push(state.engineIdx);
state.ownedEngines.sort((a,b)=>a-b);
if(typeof state.rerolls!=="number"||state.rerolls<0) state.rerolls=0;
if(!Array.isArray(state.discovered)||state.discovered.length<12){
  state.discovered=[true,...Array(11).fill(false)];
}
const firstLocked=state.discovered.indexOf(false);
if(firstLocked>=0&&firstLocked<3){
  for(let i=firstLocked;i<3;i++) state.discovered[i]=true;
}
if(typeof state.specialSel!=="boolean") state.specialSel=false;
if(!state.special) state.special=null;
if(!Array.isArray(state.cx)||state.cx.length<12){
  state.cx=[...state.cx,...Array(12-state.cx.length).fill(0)];
}

/* ---------- train math ---------- */
const eq=()=>state.equip.map(id=>WAGONS.find(w=>w.id===id));
const hasW=(id)=>state.equip.includes(id);
const ownedCount=(id)=>state.owned[id]||0;
const eng=()=>ENGINES[state.engineIdx];
function speed(){ let s=eng().sp; eq().forEach(w=>s+=w.sp); if(state.perkExpress)s+=1; return s; }
function effSpeed(){ let s=speed(), w=weight(); if(eng().pull<w) s*=eng().pull/ w; return Math.round(s*100)/100; }
function capNow(){ let c=0; eq().forEach(w=>c+=w.cap); if(state.perkFreight)c+=5; return c; }
function weight(){ let w=0; eq().forEach(wg=>w+=wg.w); return Math.round(w*10)/10; }
function pullNow(){ return eng().pull; }
function overPull(){ return weight()>pullNow(); }
function opCost(){ let c=eng().run; eq().forEach(w=>(c+=w.cost)); return c; }
function ownsE(i){ return state.ownedEngines.indexOf(i)>=0; }
function bestEngineIdx(){ let b=state.ownedEngines[0]; state.ownedEngines.forEach(i=>{if(i>b)b=i;}); return b; }
function lvNow(){ let l=0; while(l<XP.length-1&&state.tx>=XP[l+1]) l++; return l; }
function LV(){ return lvNow()+1; }
function slots(){ return Math.min(7,2+lvNow()); }
function repTier(){ let t=0; while(t<RT.length&&state.rep>=RT[t]) t++; return t; }
function nextRep(){ return RT[repTier()]; }
function repLabel(t){ return ["Outsider","Connected","Respected","Trusted","Legendary"][t]; }
function repPct(){
 const t=repTier(); if(t>=4) return 100;
 const prev=t===0?0:RT[t-1]; return Math.min(100,Math.round((state.rep-prev)/(RT[t]-prev)*100));
}
function cityLevel(i){ let l=0; while(l<CITYX.length&&state.cx[i]>=CITYX[l]) l++; return l; }
function travelH(dist){ return Math.round(dist*6/Math.max(0.1,effSpeed())*10)/10; }

 if(state.result&&cur===2&&i!==2){ const r=state.result; afterRun={net:r.net,rep:r.repChange}; state.result=null; save(); }
 cur=i; tabs.forEach((x,n)=>x.classList.toggle("active",n===i));
 i===0?trainTab():i===1?contractTab():i===2?mapTab():progressTab();
 if(panel.classList&&typeof panel.classList.remove==="function"){ panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter"); } }
let resTimer=null, afterRun=null;
function clearResultTimer(){ if(resTimer!=null){ clearTimeout(resTimer); resTimer=null; } }
function continueFromResult(){ clearResultTimer(); if(!state.result||cur!==2)return;
 const r=state.result; afterRun={net:r.net,rep:r.repChange}; state.result=null; save(); showTab(3); }
function leaveRun(i){ afterRun=null; showTab(i); }

/* ---------- goals ("one more run") ---------- */
function goals(list,max){
  const out=[], m=money(), lv=LV(), lvI=lvNow(), best=bestEngineIdx();
  if(best<ENGINES.length-1){
   const nt=ENGINES[best+1];
   out.push(lv<nt.lv?{t:fmt("elv_g",{l:nt.lv,n:t("eg_"+nt.id)}),kind:"lv",have:lv,need:nt.lv}
                   :{t:fmt("eig_g",{n:t("eg_"+nt.id)}),kind:"€",have:m,need:nt.price});
  }
  const un=WAGONS.filter(w=>w.price>0&&!ownedCount(w.id)).sort((a,b)=>unlockCost(a)-unlockCost(b))[0];
  if(un) out.push(lv<un.lv?{t:fmt("wlv_g",{l:un.lv,n:t("wc_"+un.id)}),kind:"lv",have:lv,need:un.lv}
                       :{t:fmt("wig_g",{i:un.ic,n:t("wc_"+un.id)}),kind:"€",have:m,need:unlockCost(un)});
  if(slots()<7) out.push({t:fmt("slot_g",{s:slots()+1}),kind:"xp",have:state.tx,need:XP[lvI+1]});
  if(repTier()<4) out.push({t:fmt("rep_g",{n:t("rp_"+(repTier()+1))}),kind:"rep",have:state.rep,need:nextRep()});
  return (list?list(out):out).slice(0,max||3);
}
function goalHTML(g){
  let val="";
  if(g.kind==="€"){ val = state.money>=g.need ? t("goal_ready") : fmt("eur_to_go",{x:g.need-g.have});}
  else if(g.kind==="xp")val=fmt("xp_to_go",{x:g.need-g.have>0?g.need-g.have:"0"});
  else if(g.kind==="rep")val=fmt("rep_to_go",{x:g.need-g.have>0?g.need-g.have:"0"});
  else val=fmt("lv_goal",{a:g.have,b:g.need});
  return `<div class="goal"><div class="lab">${g.t}</div><div class="val" style="color:${state.money>=g.need&&g.kind==="€"?"#2f7d43":""}">${val}</div></div>`;
}

function rarityFor(cg){
 if(cg.prem) return cg.v>=280?"epic":"rare";
 if(cg.risky) return "rare";
 if(cg.v>=240) return "rare";
 if(cg.v>=120) return "uncommon";
 return "common";
}
function makeContracts(){
  const i=state.city, cap=capNow(), pool=[]; let used=new Set();
  const cl=cityLevel(i), tier=repTier();
  const cityMult=CITIES[i].mult||1;
  const cands=[];
  [1,-1,2,-2,3,-3,4,-4].forEach(dx=>{const d=destOf(i,dx); if(d!=null&&routeOpen(i,d))cands.push(d);});
  const sh=a=>a.slice().sort(()=>Math.random()-.5);
  CITIES[i].prod.forEach(p=>{
   const cg=CARGOES[p];
   if(!cands.length) return;
   const shuffle=sh(cands);
   const d=shuffle.find(x=>!used.has(x));
   if(d==null||d===i) return;
   used.add(d); const dist=Math.abs(d-i);
   const baseAmt=(cg.bulk?6:cg.perp?2.5:3)+Math.random()*2.5;
   const headroom=cl>=1&&cg.bulk?24:0;
   const amount=Math.max(1,Math.min(cap+headroom,Math.round(baseAmt*(1+(cg.bulk?0.9:0.3)*cl)*cityMult)));
   let need=null;
   if(cg.risky&&tier>=2&&Math.random()<0.5) need="tanker";
   if(p==="mail"&&tier>=2&&Math.random()<0.5) need="mailcar";
   const rarity=rarityFor(cg);
   const tierMult={common:1,uncommon:1.15,rare:1.35,epic:1.6,legendary:2}[rarity];
   const reward=Math.round(cg.v*amount*(1+dist*0.6)*(1+cl*0.12)*tierMult*cityMult);
   const deadline=(cg.prem||cg.risky||rarity==="epic"||rarity==="legendary")?Math.max(1,Math.round(travelH(dist)*0.82*10)/10):null;
   pool.push({cargo:p,to:d,dist,amount,reward,rarity,deadline,riskdist:dist,need});
  });
  if(tier>=2){
   const prem=CITIES[i].prod.filter(p=>CARGOES[p].prem||CARGOES[p].v>=240);
   if(prem.length){
    const p=prem[Math.floor(Math.random()*prem.length)], cg=CARGOES[p];
    const d=sh([destOf(i,2),destOf(i,1),destOf(i,-1)]).find(x=>x!=null&&!used.has(x)&&x!==i);
    if(d!=null){used.add(d);const dist=Math.abs(d-i);
     const amount=Math.max(1,Math.min(cap+14,2+Math.floor(Math.random()*2)+cl));
     const reward=Math.round(cg.v*amount*(1+dist*0.7)*1.35*(1+cl*0.12)*cityMult);
     pool.push({cargo:p,to:d,dist,amount,reward,rarity:"rare",deadline:Math.max(1,Math.round(travelH(dist)*0.8*10)/10),riskdist:dist,need:null});}
   }
  }
  if(tier>=3&&!used.has(3)){
   const d=destOf(i,2)||destOf(i,1)||destOf(i,3);
   if(d!=null&&!used.has(d)){used.add(d);const dist=Math.abs(d-i);
    const amount=Math.max(1,Math.min(cap+10,5+cl));
    const reward=Math.round(CARGOES.luxury.v*amount*(1+dist*0.7)*1.6*(1+cl*0.12)*cityMult);
    pool.push({cargo:"luxury",to:d,dist,amount,reward,rarity:"epic",deadline:Math.max(1,Math.round(travelH(dist)*0.8*10)/10),riskdist:dist,need:"armored"});}
  }
  if((tier>=4||cl>=3)&&cap>=2){
   const p="luxury",cg=CARGOES.luxury;
   const d=destOf(i,3); if(d!=null&&!used.has(d)){used.add(d);
    const amount=Math.max(2,Math.min(cap,3+Math.floor(cl/2)));
    const reward=Math.round(cg.v*amount*(1+3*0.7)*2*cityMult);
    pool.push({cargo:p,to:d,dist:3,amount,reward,rarity:"legendary",deadline:Math.max(1,Math.round(travelH(3)*0.8*10)/10),riskdist:3,need:null});}
  }
  if(cl>=3&&tier>=2){
   const highVal=["electronics","machinery","luxury","passengers"].filter(p=>CITIES[i].prod.includes(p));
   if(highVal.length){
    const p=highVal[Math.floor(Math.random()*highVal.length)], cg=CARGOES[p];
    const d=sh([destOf(i,3),destOf(i,4)]).find(x=>x!=null&&!used.has(x)&&x!==i);
    if(d!=null){used.add(d);const dist=Math.abs(d-i);
     const amount=Math.max(1,Math.min(cap+6,2+Math.floor(Math.random()*2)));
     const reward=Math.round(cg.v*amount*(1+dist*0.8)*1.8*cityMult);
     pool.push({cargo:p,to:d,dist,amount,reward,rarity:"legendary",deadline:Math.max(1,Math.round(travelH(dist)*0.75*10)/10),riskdist:dist,need:null});}
   }
  }
  pool.sort((a,b)=>b.reward-a.reward);
  return pool.slice(0,7);
}

    <div class="stat">🔗 ${weight()}/${pullNow()}t</div>
    <div class="stat">💸 ${t("stat_runcost")} <b>€${opCost()}</b></div>
    <div class="stat">${special?`🎁 ${t("sp_no_risk")}`:`🎁 ×${mult} ${pickRiskLabel()}`}</div>
   </div>
   <div class="hint">${special?fmt("risk_gains",{r:Math.round(c.dist*1.2),x:Math.round(c.dist*2+6)}):fmt("risk_gains",{r:Math.round(repGainFor(c)*mult),x:Math.round(cxGainFor(c)*mult)})} ${!special&&c.deadline?`· ${fmt("deadline_meta",{t:tH,d:c.deadline,ok:t(late?"late_mark":"ok_mark")})}`:`· ${t("no_deadline")}`}</div>
   ${routeHTML(state.city,c.to)}

  <div class="event" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
   <div><b>${t("cg_"+c.cargo)} ×${c.amount}</b> <span class="muted">· ${c.dist} ${c.dist===1?t("hop"):t("hops")}</span></div>
   ${special?`<button class="small" onclick="cancelSpecial()">${t("cancel_sp")}</button>`:""}
  </div>
   ${pixHTML("pix")}
   ${historyHTML()}`;
  pixCanvas("pix",2);
}
function historyHTML(){
  return state.log.length?`<h3 style="margin-top:16px">${t("run_log")}</h3><div class="log">${state.log.slice(-8).reverse().join("<br>")}</div>`:"";
}
function xpFillPct(tx){ let l=0; while(l<XP.length-1&&tx>=XP[l+1]) l++; if(l>=XP.length-1) return 100; return Math.round((tx-XP[l])/(XP[l+1]-XP[l])*100); }
function maxLvReached(){ return lvNow()>=XP.length-1; }
function resultXpHTML(r){
  const maxLv=XP.length;
  const fromLv=Math.min(maxLv,Math.max(1,r.lvBefore+1));
  const toLv=Math.min(maxLv,LV());
  const fromPct=xpFillPct(r.txBefore), toPct=xpFillPct(state.tx);
  const finalBar=maxLvReached()?100:toPct;
  const lvlup=toLv>fromLv;
  const maxTxt=toLv>=maxLv?` <span class="xp-max">${fmt("xp_max",{l:maxLv})}</span>`:` → ${toLv}`;
  return `<div class="result-xp">
    <div class="xp-row"><span>${fmt("xp_label",{l:fromLv})}${lvlup?` → <b>${toLv}</b> <span class="lvlup">${t("xp_levelup")}</span>`:maxTxt}</span>
      <span class="xp-gain">+${r.xpGain} XP</span></div>
    <div class="xpbar" style="margin:8px 0 2px"><div id="rxpf" class="fill${fromPct<100?" xp-fill-anim":""}" style="width:${fromPct}%"></div></div>
    <div class="xp-row"><span class="muted">${maxLvReached()?t("xp_max_done"):fmt("xp_to_next",{a:state.tx-XP[Math.min(lvNow(),XP.length-1)],b:XP[Math.min(lvNow()+1,XP.length-1)]-XP[Math.min(lvNow(),XP.length-1)]})}</span></div>
   </div>`;
}
function animateResultXp(r){
  const bar=document.getElementById("rxpf"); if(!bar) return;
  const to=maxLvReached()?100:xpFillPct(state.tx);
  const step=()=>{ requestAnimationFrame(()=>{ bar.style.width=to+"%"; }); };
  step();
}
function renderResult(){
  const r=state.result;
  const details=[
   {l:t("d_cargo"),v:r.cargo},{l:t("d_dist"),v:r.dist+" "+(r.dist===1?t("hop"):t("hops"))},
   {l:t("d_base"),v:"€"+r.base},{l:t("d_mult"),v:"×"+r.routeMult},
   {l:t("d_wbonus"),v:"×"+r.bonus.toFixed(2)},
   {l:t("d_events"),v:(r.gain>=0?"+":"")+"€"+r.gain+" ("+r.handled+" "+(r.handled===1?t("hop"):t("hops"))+")"},
   {l:t("d_rep"),v:(r.repChange>=0?"+":"")+r.repChange},{l:t("d_net"),v:"€"+r.net}
  ].map(d=>`<div class="detail"><div class="label">${d.l}</div><div class="value">${d.v}</div></div>`).join("");
panel.innerHTML=`<h2>${t("arrived")}${r.to}</h2>
   ${pixHTML("pix")}
   <div class="result-screen ${r.good?"good":"bad"} result-in">
    <div class="icon">${r.good?"🚂✅":"🚂❌"}</div>
    <h2>${r.good?r.late?t("late_title"):t("good_title"):t("bad_title")}</h2>
    <div class="details">${details}</div>
     ${r.late?`<p class="muted">${t("late_note")}</p>`:""}
     ${r.news.length?`<div style="margin:10px 0">${r.news.map(n=>`<span class="badge" style="background:#e2f0e5;color:#2f7d43;border:1px solid #2f7d43;margin:2px">${n}</span>`).join(" ")}</div>`:""}
     ${resultXpHTML(r)}
     <button class="action gold" onclick="continueFromResult()">${t("result_continue")}</button>
    </div>
    ${historyHTML()}`;
  pixCanvas("pix",3);
  animateResultXp(r);
}

/* ---------- progress tab ---------- */
function progressTab(){
  const st=state.stats, lv=LV(), lvI=lvNow();
  const totalOwned=Object.values(state.owned).reduce((s,n)=>s+n,0);
  const achHTML=ACH.map(a=>`<div class="achrow ${state.ach.includes(a.id)?"done":""}"><div><b>${t("ach_"+a.id)}</b> <span class="muted" style="font-size:12px">— ${t("achd_"+a.id)}</span></div><div class="val">${state.ach.includes(a.id)?"✓ +€"+a.rw:"−"}</div></div>`).join("");
  const chHTML=CH.map((c,i)=>{ const done=state.chapter>i; return `<div class="achrow ${done?"done":""}"><div><b>${t("ch_"+i)}</b>${i===state.chapter?`<span class="badge" style="margin-left:8px">${t("next")}</span>`:""}</div><div class="val">${done?"✓":""}</div></div>`;}).join("");
  const cityHTML=CITIES.map((ct,i)=>`<div class="card" style="padding:10px"><div><b>${ct.i} ${ct.n}</b> · Lv ${cityLevel(i)+1} ${state.discovered[i]?"":"🔒"}</div>
<div class="cbar"><div class="fill" style="width:${Math.min(100,Math.round(state.cx[i]/CITYX[cityLevel(i)]*100))}%"></div></div>
    <span class="muted" style="font-size:11px">${fmt("town_xp",{x:state.cx[i]})}</span> <span class="chip">${ct.prod.map(p=>t("cg_"+p)).join(" · ")}</span></div>`).join("");
  panel.innerHTML=`<h2>${t("progress_h")}</h2>
   ${afterRun?`<div class="runbanner"><div class="runbanner-title">💐 ${t("run_done")} +€${afterRun.net}</div>
    <div class="muted" style="margin:4px 0 10px">${fmt("run_done_sub",{n:afterRun.net,r:(afterRun.rep>=0?"+":"")+afterRun.rep})}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${goals().map(goalHTML).join("")||`<p class="muted">${t("all_unlocked")}</p>`}</div>
    <div style="display:flex;gap:10px;margin-top:12px">
     <button class="flowbtn" onclick="leaveRun(0)">${t("to_train_btn")}</button>
     <button class="flowbtn gold" onclick="leaveRun(1)">${t("to_contracts_btn")}</button>
    </div></div>`:""}
   <div class="grid2" style="margin-bottom:6px">
    <div class="card"><b>${fmt("train_card",{l:lv})}</b> ${state.tx} XP ${slots()} ${t("stat_slots")}
     <div class="xpbar"><div class="fill" style="width:${lvI>=XP.length-1?100:Math.round((state.tx-XP[lvI])/(XP[lvI+1]-XP[lvI])*100)}%"></div></div>
     <span class="muted" style="font-size:12px">${fmt("wagons_line",{a:totalOwned,b:WAGONS.length,e:t("eg_"+ENGINES[state.engineIdx].id)})}</span>
     ${pixHTML("pix")}</div>
    <div class="card"><b>${fmt("rep_card",{r:state.rep})}</b> ${t("rp_"+repTier())}
     <div class="rep-bar"><div class="fill" style="width:${repPct()}%"></div></div>
     <span class="muted" style="font-size:12px">${fmt("next_tier",{a:repTier()<4?fmt("at_rep",{x:nextRep()}):t("max_t")})}</span></div>
   </div>
   <div class="hint">${fmt("stats_line",{d:st.deliv,c:st.cargo,s:st.best,p:st.premDel})}</div>
   <details class="collapsible"><summary>${t("chapters")}</summary>${chHTML}</details>
   <details class="collapsible"><summary>${t("ach_h")} <span class="muted" style="font-size:12px">${state.ach.length}/${ACH.length}</span></summary>${achHTML}</details>
   <details class="collapsible"><summary>${t("cities")}</summary>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${cityHTML}</div></details>
   <button class="small" style="width:100%;margin-top:18px;background:#b6452e;color:#fff" onclick="resetGame()">${t("reset_save")}</button>`;
  pixCanvas("pix",2);
}
function resetGame(){ kancel(); localStorage.removeItem("railrun_v3"); state=fresh(); save(); showTab(0); }

/* ---------- boot ---------- */
state = Object.assign(fresh(),state);
if(!state.contracts.length) state.contracts=makeContracts();
save(); update(); langBtn(); showTab(cur);
</script>
</body>
</html>
