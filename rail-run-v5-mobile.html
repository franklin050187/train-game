<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rail Run — Game Loop POC v3</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2b2722;
 background:
  radial-gradient(circle at 4% -4%, rgba(217,164,65,.16), transparent 240px),
  radial-gradient(circle at 97% 0%, rgba(47,110,90,.10), transparent 280px),
  linear-gradient(#f6f0e2,#eee5d0)}
.app{max-width:1080px;margin:auto;padding:18px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:16px;
 position:relative;border-bottom:3px double #d9a441}
.top:after{content:"";position:absolute;left:0;right:0;top:100%;height:3px;margin-top:1px;
 background:repeating-linear-gradient(90deg,#2f6e5a 0 12px,transparent 12px 16px);opacity:.55}
h1{font-size:30px;margin:0;color:#1f5240;letter-spacing:.5px}
h2{color:#2b2722}
h3,h4{color:#3d362a}
p{margin-top:0}
.money{font-size:24px;font-weight:800;color:#a4761a;background:#fff8e3;border:1px solid #e3cf96;padding:3px 16px;border-radius:24px}
.hud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:#6b624f;margin-top:6px}
.hud-seg{display:inline-flex;align-items:center;gap:8px;background:#fff8e3;border:1px solid #e3cf96;padding:4px 10px;border-radius:20px;font-weight:700}
.hud-lv{color:#1f5240}
.hud-xp{color:#a4761a;font-weight:800}
.hud-sep{color:#c8b57f;font-weight:800}
.hud-note{font-weight:800;color:#a4761a;white-space:nowrap}
.hud-note.ok{color:#2f7d43}
.hud-done{color:#2f7d43;font-weight:800}
.hud-bar{display:inline-block;width:70px;height:8px;background:#eee6d0;border-radius:5px;overflow:hidden;vertical-align:middle}
.hud-bar span{display:block;height:100%;background:linear-gradient(90deg,#3f7ed6,#7cb2f8)}
.tabs{display:flex;gap:8px;margin:20px 0 14px}
.tab{flex:1;padding:12px;border:1px solid #dfd3b4;background:#f7f1e0;color:#6b624f;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;transition:background .15s,color .15s}
.tab:hover{background:#fff7e2}
.tab.active{background:#2f6e5a;color:#fdf9ee;border-color:#1f5240;box-shadow:inset 0 3px 0 #d9a441,0 2px 6px rgba(47,110,90,.25)}
.panel{background:#fffdf6;border:1px solid #e0d5ba;border-radius:16px;padding:22px;min-height:520px;
 box-shadow:0 12px 32px rgba(94,74,32,.10);
 background-image:repeating-linear-gradient(0deg,rgba(217,164,65,.04) 0 1px,transparent 1px 15px)}
.panel.enter{animation:panelin .28s ease}
@keyframes panelin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fffdf5;border:1px solid #e7dcc0;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(94,74,32,.06)}
.card.sel{border-color:#d9a441;box-shadow:0 0 0 2px #d9a441 inset,0 1px 3px rgba(94,74,32,.06)}
button.action{width:100%;padding:14px;border:0;border-radius:10px;background:#2f6e5a;color:#fdf9ee;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #1f5240;font-size:16px}
button.action:hover{background:#387e68}
button.action:active{transform:translateY(2px);box-shadow:0 1px 0 #1f5240}
button.action.gold{background:#d9a441;color:#241a06;box-shadow:0 3px 0 #a4761a}
button.action.gold:hover{background:#e2b254}
button.action:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
button.small{padding:8px 14px;font-size:13px;margin-top:4px;width:auto;border-radius:8px;background:#efe8d4;border:1px solid #e0d5ba;color:#3d362a}
button.small:hover{background:#e7dec6}
.flowbtn{width:100%;padding:15px;border-radius:11px;border:1px solid #e0d5ba;background:#efe8d4;color:#3d362a;font-weight:800;cursor:pointer;font-size:16px}
.flowbtn:hover{background:#e7dec6}
.flowbtn.gold{background:#d9a441;color:#241a06;border-color:#c08c28;box-shadow:0 3px 0 #a4761a}
.flowbtn.gold:hover{background:#e2b254}
.flowbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.muted{color:#8a7f6b}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
.stat{background:#fffdf5;border:1px solid #e7dcc0;border-radius:9px;padding:10px 14px;font-size:15px;color:#3d362a}
.stat b{font-size:18px;color:#2b2722}
.rep-bar,.xpbar,.cbar{height:9px;background:#eee6d0;border-radius:5px;overflow:hidden;margin:6px 0;box-shadow:inset 0 1px 2px rgba(94,74,32,.15)}
.rep-bar .fill{height:100%;background:linear-gradient(90deg,#c08c28,#e0b24a);transition:width .3s}
.xpbar .fill{height:100%;background:linear-gradient(90deg,#3f7ed6,#7cb2f8)}
.result-xp{text-align:left;margin:16px 4px 2px;padding-top:4px;border-top:1px solid #eadfc2}
.result-xp .xp-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6b5f44}
.result-xp .xp-gain{font-weight:800;color:#2f7d43}
.result-xp .lvlup{display:inline-block;color:#fff;background:#2f7d43;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:800;margin-left:6px;animation:lvlpop 1s ease}
@keyframes lvlpop{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.xp-fill-anim{transition:width 2.8s cubic-bezier(.2,1.4,.4,1)}
.xp-max{color:#a4761a;font-weight:800}
.cbar .fill{height:100%;background:linear-gradient(90deg,#2f7d43,#67d17e)}
.rarity{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700;text-transform:uppercase;margin-right:6px}
.r-common{background:#e9e2cf;color:#5c5340}.r-uncommon{background:#dcefe3;color:#1f6b3d;border:1px solid #bfdcca}
.r-rare{background:#e2edfb;color:#2a63a8;border:1px solid #c3d9f0}.r-epic{background:#f0e3f6;color:#6b3f8f;border:1px solid #dcc8e8}.r-legendary{background:#fbe9d2;color:#a05e17;border:1px solid #f0d3a8}
.badge{display:inline-block;padding:3px 7px;border-radius:6px;background:#efe7d4;color:#5c5340;font-size:12px;font-weight:700}
.chip{display:inline-block;padding:3px 8px;border-radius:20px;background:#f2ead8;border:1px solid #e0d5ba;font-size:12px;margin-right:6px;margin-bottom:4px}
.route{position:relative;margin:38px 10px 44px;display:flex;justify-content:space-between}
.line{position:absolute;left:4%;right:4%;top:20px;height:6px;background:linear-gradient(#b8a97f,#998a63);border-radius:4px}
.city{position:relative;z-index:2;text-align:center;width:24%}
.dot{width:38px;height:38px;margin:auto;border-radius:50%;background:#fbf5e4;border:4px solid #a89c85;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(94,74,32,.15)}
.city.current .dot{border-color:#d9a441;background:#f7eccb}
.city.dest .dot{border-color:#2f7d43;background:#dcefe3}
.marker{position:absolute;z-index:3;font-size:18px;top:-16px;transform:translateX(-50%)}
.city-name{margin-top:8px;font-weight:800;font-size:13px;color:#3d362a}
.over-cap{background:#fbecea!important;border-color:#b6452e!important;opacity:.85}
.locked{background:#f3eaf6!important;border-color:#7a4a8a!important;opacity:.9}
.event{background:#fbf6e7;border:1px solid #e7dcc0;border-radius:12px;padding:16px;margin:14px 0}
.choices{display:grid;gap:8px;margin-top:10px}
@media(max-width:600px){.choices{grid-template-columns:1fr}}
.log{max-height:150px;overflow:auto;background:#f1ead7;border:1px solid #e0d5ba;padding:10px;border-radius:9px;font-size:13px;color:#4a4436}
.result-screen{background:#fdfaf0;border:1px solid #dcd0ae;border-radius:14px;padding:22px;text-align:center;margin:14px 0}
.result-screen.good{border-color:#2f7d43;background:#eef6e9}
.result-screen.bad{border-color:#b6452e;background:#fbf0eb}
.result-screen.result-in{animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
.result-screen .icon{font-size:46px}
.result-screen h2{font-size:26px;margin:6px 0 10px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:14px 0}
.detail{background:#fffdf5;border:1px solid #e7dcc0;padding:10px;border-radius:8px}
.detail .label{font-size:11px;color:#8a7f6b;text-transform:uppercase}
.detail .value{font-size:18px;font-weight:800;color:#2b2722}
.out-banner{border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:700}
.out-banner.good{background:#e2f0e5;border:1px solid #2f7d43}
.out-banner.loss{background:#f6e2dc;border:1px solid #b6452e}
.out-banner.calm{background:#f1ead7;border:1px solid #e0d5ba}
.risk{flex:1;padding:10px;border:1px solid #dfd3b4;background:#fffdf5;border-radius:10px;cursor:pointer;text-align:center;color:#3d362a}
.risk.sel{border-color:#d9a441;background:#fbf4df;box-shadow:0 0 0 1px #d9a441 inset}
.risk b{display:block;font-size:16px}
.goal{background:#fffdf5;border:1px solid #e7dcc0;border-radius:10px;padding:10px 12px;text-align:center}
.goal .lab{font-size:11px;color:#8a7f6b;text-transform:uppercase}
.goal .val{font-size:15px;font-weight:800}
.eng{background:#fffdf5;border:1px solid #e7dcc0;border-radius:12px;padding:14px}
.eng.own{border-color:#d9a441}
.eng.sel{border-color:#2f6e5a;background:#eef6e9;box-shadow:0 0 0 1px #2f6e5a inset}
.achrow{background:#fffdf5;border:1px solid #e7dcc0;border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.achrow.done{border-color:#2f7d43}
.achrow .val{font-weight:800;color:#a4761a;white-space:nowrap}
.hint{border:1px dashed #d9c68f;border-radius:10px;padding:10px 12px;background:#fbf6e7;font-size:13px;color:#6b624f;margin:10px 0}
.wagon-slot{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fffdf5;border:1px solid #e7dcc0;border-radius:8px;margin:4px 0;box-sizing:border-box}
.wagon-slot .remove{background:#b6452e;border:0;padding:4px 8px;border-radius:4px;color:#fff;cursor:pointer}
.newcity{animation:blink 1.6s ease-in-out infinite;font-weight:800;color:#a4761a}
@keyframes blink{50%{opacity:.35}}
.pixwin{display:block;image-rendering:pixelated;max-width:100%;height:auto;margin:12px auto}
.jscene{position:relative;margin:14px 0 2px;border:3px solid #c9a540;border-radius:14px;box-shadow:0 2px 10px rgba(94,74,32,.18),inset 0 0 0 2px #e7dcb6;overflow:hidden}
.jcan{width:100%;height:auto;display:block;image-rendering:pixelated;background:#0f1420;border:0;border-radius:10px}
.jcity{position:absolute;top:6px;font-size:11px;font-weight:800;color:#e9e2cc;z-index:3;background:rgba(20,26,36,.55);padding:1px 6px;border-radius:6px}
.jstart{left:6px}
.jend{right:6px}
.jbubble{position:absolute;top:auto;bottom:10px;transform:translateX(-50%);font-size:24px;z-index:5;animation:bounce .9s ease-in-out infinite;text-align:center;line-height:1}
.jbubble.done{animation:none;opacity:.9}
.jbubble .mark{display:block;font-size:10px;color:#f5d742}
@keyframes bounce{50%{transform:translateX(-50%) translateY(-7px)}}
.departing{text-align:center;font-weight:800;color:#a4761a;letter-spacing:.5px;animation:dp 1.7s ease-out both;font-size:16px}
@keyframes dp{0%{opacity:0;transform:translateY(10px)}18%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.runbanner{background:linear-gradient(180deg,#eef6e9,#fffdf6);border:1px solid #2f7d43;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 6px 16px rgba(47,125,67,.12);animation:popin .4s ease}
.runbanner-title{font-size:19px;font-weight:800;color:#1f5240}
@media(max-width:760px){.grid,.grid2{grid-template-columns:1fr}.route{margin-top:22px}.top{flex-direction:column;align-items:flex-start;gap:8px}}
@media(max-width:600px){
  .app{padding:12px 10px 30px}
  h1{font-size:24px}
  h2{font-size:20px}
  h3{font-size:16px}
  .money{font-size:18px;padding:2px 10px}
  .tabs{gap:4px;margin:12px 0 10px}
  .tab{padding:8px 6px;font-size:12px}
  .panel{padding:14px;min-height:400px}
  .stat{padding:8px 11px;font-size:13px}
  .stat b{font-size:15px}
  .stats{gap:6px}
  .card{padding:10px}
  .wagon-slot{padding:6px 8px;font-size:12px}
  .wagon-slot .remove{padding:3px 6px;font-size:11px}
  button.action{padding:11px;font-size:15px}
  button.small{padding:6px 10px;font-size:12px}
  .flowbtn{padding:11px;font-size:14px}
  .risk{padding:8px;font-size:14px}
  .route{margin:20px 4px 30px}
  .city-name{font-size:11px}
  .dot{width:30px;height:30px}
  .line{height:4px;top:16px}
  .detail{padding:8px}
  .detail .value{font-size:15px}
  .result-screen{padding:16px}
  .result-screen h2{font-size:20px}
  .result-screen .icon{font-size:36px}
  .runbanner{padding:12px}
  .runbanner-title{font-size:16px}
  .log{max-height:120px;padding:8px;font-size:12px}
  .event{padding:12px}
  .hint{padding:8px 10px;font-size:12px}
  .jscene{margin:10px 0 2px}
  .jbubble{font-size:20px}
  .departing{font-size:14px}
}
/* tutorial overlay */
.tut-overlay{position:fixed;inset:0;z-index:900;pointer-events:none}
.tut-dim{position:absolute;inset:0;background:rgba(10,14,20,.55);pointer-events:none}
.tut-spot{position:absolute;border:3px solid #f5d742;border-radius:14px;box-shadow:0 0 0 4px rgba(245,215,66,.25),0 0 24px rgba(245,215,66,.35);pointer-events:none;animation:tutpulse 1.8s ease-in-out infinite;z-index:902;transition:all .35s ease}
@keyframes tutpulse{0%,100%{box-shadow:0 0 0 4px rgba(245,215,66,.25),0 0 24px rgba(245,215,66,.35)}50%{box-shadow:0 0 0 8px rgba(245,215,66,.15),0 0 36px rgba(245,215,66,.45)}}
.tut-tip{position:absolute;max-width:340px;background:#1f2937;color:#fdf9ee;border:2px solid #d9a441;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.5;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:903;pointer-events:auto;animation:tipin .3s ease}
@keyframes tipin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tut-tip h3{margin:0 0 6px;font-size:19px;color:#f5d742}
.tut-tip p{margin:0 0 10px;color:#d1d5db}
.tut-arrow{position:absolute;z-index:904;pointer-events:none;animation:arrowbob 1.2s ease-in-out infinite}
@keyframes arrowbob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.tut-btn{display:inline-block;padding:10px 20px;background:#d9a441;color:#241a06;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
.tut-btn:hover{background:#e2b254}
.tut-btn.lang{font-size:17px;padding:12px 22px;background:#2f7d43}
.tut-btn.lang:hover{background:#3c9451}
.tut-skip{position:absolute;top:12px;right:14px;z-index:905;background:rgba(31,41,55,.8);color:#d1d5db;border:1px solid #6b7280;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;pointer-events:auto}
.tut-skip:hover{background:#374151;color:#fdf9ee}
@media(max-width:480px){
  .tab{padding:6px 4px;font-size:11px}
  .tabs{margin:8px 0 8px}
  .stat{padding:6px 8px;font-size:11px}
  .stat b{font-size:13px}
  .panel{padding:10px}
  .card{padding:8px}
  .wagon-slot{flex-wrap:wrap;gap:4px}
  .wagon-slot .remove{width:100%;margin-top:4px}
  .details{grid-template-columns:1fr}
  .achrow{flex-direction:column;align-items:flex-start;gap:4px}
  .achrow .val{font-size:13px}
  .city{width:20%}
  .dot{width:26px;height:26px}
  .city-name{font-size:10px}
}
.collapsible{margin:8px 0;border:1px solid #e7dcc0;border-radius:10px;background:#fffdf5;overflow:hidden}
.collapsible summary{cursor:pointer;padding:10px 12px;font-weight:700;color:#3d362a;list-style:none;display:flex;justify-content:space-between;align-items:center}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible summary:after{content:"▼";font-size:10px;color:#8a7f6b;transition:transform .2s}
.collapsible[open] summary:after{transform:rotate(180deg)}
.collapsible > div{padding:0 12px 12px}
@media(max-width:600px){.collapsible summary{padding:8px 10px;font-size:13px}.collapsible > div{padding:0 10px 10px}}


/* ---------- v4 mobile-first game UX ---------- */
.goalbar{display:flex;align-items:center;gap:10px;margin:8px 0 10px;padding:10px 12px;background:#fff8e3;border:1px solid #e3cf96;border-radius:12px}
.goalbar .goal-icon{font-size:20px}.goalbar .goal-copy{min-width:0;flex:1}.goalbar b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#8a6b27}.goalbar span{display:block;font-weight:800;font-size:14px;color:#2b2722;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbar{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:#2f6e5a;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.nextbar .next-label{opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.nextbar .next-text{flex:1}
.mobile-cta{display:none}
@media(max-width:600px){
 body{padding-bottom:92px}
 .app{padding:10px 10px 110px}
 .top{padding-bottom:10px;margin-bottom:7px;border-bottom:0}
 .top:after{display:none}
 h1{font-size:23px}
 .money{font-size:18px;padding:4px 11px}
 #langbtn{display:none}
 .hud{font-size:11px;gap:4px;margin-top:2px}
 .hud-seg{padding:3px 7px}
 .hud-note{display:none}
 .tabs{position:sticky;top:0;z-index:30;gap:4px;margin:0 -10px 8px;padding:5px 10px;background:#f6f0e2;border-bottom:1px solid #dfd3b4}
 .tab{padding:9px 4px;border-radius:9px;font-size:12px}
 .panel{min-height:calc(100vh - 190px);padding:14px 12px 20px;border-radius:13px;box-shadow:0 5px 18px rgba(94,74,32,.09)}
 .panel h2{font-size:20px;margin:2px 0 10px}
 .grid{grid-template-columns:1fr;gap:9px}
 .grid2{grid-template-columns:1fr;gap:9px}
 .stats{gap:6px;margin:7px 0 10px}
 .stat{padding:7px 9px;font-size:12px;flex:1;min-width:30%}
 .stat b{font-size:15px}
 .route{margin:25px 4px 30px}
 .city-name{font-size:11px}
 .dot{width:32px;height:32px}
 .goalbar{margin:5px 0 7px;padding:8px 10px}
 .goalbar span{font-size:13px}
 .nextbar{margin:0 0 8px;padding:7px 10px}
 .mobile-cta{position:fixed;display:block;left:0;right:0;bottom:0;z-index:100;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(246,240,226,.96);backdrop-filter:blur(10px);border-top:1px solid #d9cba8;box-shadow:0 -5px 18px rgba(50,40,20,.12)}
 .mobile-cta button{width:100%;min-height:52px;margin:0;font-size:17px;border-radius:13px}
 .mobile-cta button:disabled{opacity:.45}
 /* Hide secondary management/detail content on small screens until explicitly opened */
 .mobile-secondary{display:none!important}
 .log{max-height:90px}
 .result-screen{padding:16px 12px}
 .result-screen .icon{font-size:38px}
 .result-screen h2{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🚂 Rail Run</h1><div class="hud" id="hud"></div></div>
    <div style="display:flex;gap:16px;align-items:center">
      <button id="langbtn" class="tab" style="flex:0;padding:8px 14px" onclick="toggleLang()"></button>
      <div class="money">€<span id="money">600</span></div>
    </div>
  </div>
  <div class="goalbar">
    <div class="goal-icon">🏆</div>
    <div class="goal-copy"><b id="goal-title">Goal</b><span id="goal-text">Build your railway and connect every town.</span></div>
  </div>
  <div class="nextbar" id="nextbar"><span class="next-label">Next</span><span class="next-text" id="next-text">Choose a delivery</span></div>

function nextLockedCity(){ for(let i=0;i<CITIES.length;i++) if(!state.discovered[i]) return i; return -1; }
function routeOpen(i,d){ const a=Math.min(i,d),b=Math.max(i,d); for(let k=a;k<=b;k++) if(!state.discovered[k]) return false; return true; }
function unlockCost(w){ return (w.price>0&&ownedCount(w.id)===0)?w.up:w.price; }

 state.equip.forEach((id,k)=>put(V3_WAGF(id),k*16,PA[id]||PA.box));
 return {g,W,H};
}

 const x=cv.getContext("2d");x.imageSmoothingEnabled=false;
 for(let y=0;y<H;y++){for(let xx=0;xx<W;xx++){if(!g[y][xx])continue;x.fillStyle=g[y][xx];x.fillRect(xx*scale,y*scale,scale,scale);}}
x.fillStyle="#e3d7b6";x.fillRect(0,H*scale,W*scale,scale);
  x.fillStyle="#c9bd9e";x.fillRect(0,(H+1)*scale,W*scale,scale);
  x.fillStyle="#998a63";for(let i=0;i<W;i++){if(i%2)x.fillRect(i*scale,(H+1)*scale,scale,Math.floor(scale*0.6));}

/* ---------- tutorial ---------- */
const TUT_STEPS=["pick_lang","welcome","buy_engine","buy_wagon","pick_contract","pick_risk","go","event","done"];
function inTutorial(){ return state.tutorial<TUT_STEPS.length; }
function tutDone(){ return state.tutorial>=TUT_STEPS.length-1; }
function tutStep(){ return TUT_STEPS[state.tutorial]||"done"; }
function nextTutorialStep(){ state.tutorial++; }

if(Array.isArray(state.owned)){
  const migrated={};
  state.owned.forEach(id=>migrated[id]=(migrated[id]||0)+1);
  state.owned=migrated;
}
state.owned=state.owned||{box:1};
state.equip=state.equip||["box"];
if(typeof state.tutorial!=="number") state.tutorial=0;
const tutPrep=["pick_lang","welcome","buy_engine","buy_wagon"].includes(tutStep());
if(!tutPrep){
 if(!state.ownedEngines||!state.ownedEngines.length) state.ownedEngines=[0];
 if(state.engineIdx>=0&&state.ownedEngines.indexOf(state.engineIdx)<0) state.ownedEngines.push(state.engineIdx);
}
if(!state.ownedEngines||!state.ownedEngines.length) state.ownedEngines=[];
state.ownedEngines.sort((a,b)=>a-b);
if(typeof state.rerolls!=="number"||state.rerolls<0) state.rerolls=0;
if(!Array.isArray(state.discovered)||state.discovered.length<12){
  state.discovered=[true,...Array(11).fill(false)];
}
const firstLocked=state.discovered.indexOf(false);
if(firstLocked>=0&&firstLocked<3){
  for(let i=firstLocked;i<3;i++) state.discovered[i]=true;
}
if(typeof state.specialSel!=="boolean") state.specialSel=false;
if(!state.special) state.special=null;
if(!Array.isArray(state.cx)||state.cx.length<12){
  state.cx=[...state.cx,...Array(12-state.cx.length).fill(0)];
}
if(typeof state.tutorial!=="number") state.tutorial=0;
if(_sv&&_sv.v!==2&&typeof _sv.tutorial==="number"){
  state.tutorial=_sv.tutorial<8?_sv.tutorial+1:9;
}

/* ---------- train math ---------- */
const eq=()=>state.equip.map(id=>WAGONS.find(w=>w.id===id));
const hasW=(id)=>state.equip.includes(id);
const ownedCount=(id)=>state.owned[id]||0;
const eng=()=>ENGINES[state.engineIdx];
function speed(){ let s=eng().sp; eq().forEach(w=>s+=w.sp); if(state.perkExpress)s+=1; return s; }
function effSpeed(){ let s=speed(), w=weight(); if(eng().pull<w) s*=eng().pull/ w; return Math.round(s*100)/100; }
function capNow(){ let c=0; eq().forEach(w=>c+=w.cap); if(state.perkFreight)c+=5; return c; }
function weight(){ let w=0; eq().forEach(wg=>w+=wg.w); return Math.round(w*10)/10; }
function pullNow(){ return eng().pull; }
function overPull(){ return weight()>pullNow(); }
function opCost(){ let c=eng().run; eq().forEach(w=>(c+=w.cost)); return c; }
function ownsE(i){ return state.ownedEngines.indexOf(i)>=0; }
function bestEngineIdx(){ let b=state.ownedEngines[0]; if(b===undefined) return -1; state.ownedEngines.forEach(i=>{if(i>b)b=i;}); return b; }
function lvNow(){ let l=0; while(l<XP.length-1&&state.tx>=XP[l+1]) l++; return l; }
function LV(){ return lvNow()+1; }
function slots(){ return Math.min(7,2+lvNow()); }
function repTier(){ let t=0; while(t<RT.length&&state.rep>=RT[t]) t++; return t; }
function nextRep(){ return RT[repTier()]; }
function repLabel(t){ return ["Outsider","Connected","Respected","Trusted","Legendary"][t]; }
function repPct(){
 const t=repTier(); if(t>=4) return 100;
 const prev=t===0?0:RT[t-1]; return Math.min(100,Math.round((state.rep-prev)/(RT[t]-prev)*100));
}
function cityLevel(i){ let l=0; while(l<CITYX.length&&state.cx[i]>=CITYX[l]) l++; return l; }
function travelH(dist){ return Math.round(dist*6/Math.max(0.1,effSpeed())*10)/10; }

 };
 const q=labels[LANG]||labels.en;
 if(gt)gt.textContent=q.goal;
 if(gx)gx.textContent=q.goalText;
 let txt=q.train, action="contracts", disabled=false;
 if(state.result){ txt=q.progress; action="progress"; }
 else if(cur===0){ txt=q.train; action="contracts"; }
 else if(cur===1){
   if(state.contract!==null||state.specialSel){txt=q.contracts;action="go";}
   else {txt=q.train;action="train";}
 }
 else if(cur===2){
   if(state.active){ nb.style.display="none"; document.getElementById("mobile-cta").style.display="none"; return; }
   if(state.contract!==null||state.specialSel){
     if(overPull() || (!state.specialSel && state.contract!==null && ((state.contracts[state.contract]||{}).need&&!hasW(state.contracts[state.contract].need)) || (!state.specialSel && state.contract!==null && overCap(state.contracts[state.contract])))){
       txt=q.blocked; action="train";
     } else {txt=q.go;action="go";}
   } else {txt=q.train;action="contracts";}
 }
 else if(cur===3){txt=q.train;action="contracts";}
 if(nb){nb.style.display="flex";nt.textContent=txt;}

function mobileNext(){
 if(cur===0){showTab(1);return;}
 if(cur===1){
   if(state.contract!==null||state.specialSel){showTab(2);return;}
   showTab(1);return;
 }
 if(cur===2){
   if(state.result){continueFromResult();return;}
   if(state.contract!==null||state.specialSel){
     const c=state.specialSel?state.special:state.contracts[state.contract];
     if(overPull() || (!state.specialSel && c && ((c.need&&!hasW(c.need))||overCap(c)))){showTab(0);return;}
     go(); return;
   }
   showTab(1);return;
 }
 if(cur===3){showTab(1);return;}
}

function log(m){ state.log.push(m); if(state.log.length>40)state.log.shift(); }
function showTab(i){ clearResultTimer();
 if(!tutDone()&&inTutorial()){
  const allowed={pick_lang:0,welcome:0,buy_engine:0,buy_wagon:0,pick_contract:1,pick_risk:2,go:2,event:2,done:null};
  const a=allowed[tutStep()];
  if(a!==null&&a!==undefined&&i!==a)return;
 }
 if(state.result&&cur===2&&i!==2){ const r=state.result; afterRun={net:r.net,rep:r.repChange}; state.result=null; save(); }
 cur=i;
 const tabs=[...document.querySelectorAll(".tab[data-tab]")];
 tabs.forEach((x,n)=>x.classList.toggle("active",n===i));
 const panel=document.getElementById("panel");
 i===0?trainTab():i===1?contractTab():i===2?mapTab():progressTab();
 if(panel.classList&&typeof panel.classList.remove==="function"){ panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter"); }
 if(typeof renderTutorial==="function")renderTutorial();

}
let resTimer=null, afterRun=null;

function continueFromResult(){ clearResultTimer(); if(!state.result||cur!==2)return;
 const r=state.result; afterRun={net:r.net,rep:r.repChange}; state.result=null; save(); showTab(3); }

/* ---------- goals ("one more run") ---------- */
function goals(list,max){
  const out=[], m=money(), lv=LV(), lvI=lvNow(), best=bestEngineIdx();
  if(best<ENGINES.length-1){
   const nt=ENGINES[best+1];
   out.push(lv<nt.lv?{t:fmt("elv_g",{l:nt.lv,n:t("eg_"+nt.id)}),kind:"lv",have:lv,need:nt.lv}
                   :{t:fmt("eig_g",{n:t("eg_"+nt.id)}),kind:"€",have:m,need:nt.price});
  }
  const un=WAGONS.filter(w=>w.price>0&&!ownedCount(w.id)).sort((a,b)=>unlockCost(a)-unlockCost(b))[0];
  if(un) out.push(lv<un.lv?{t:fmt("wlv_g",{l:un.lv,n:t("wc_"+un.id)}),kind:"lv",have:lv,need:un.lv}
                       :{t:fmt("wig_g",{i:un.ic,n:t("wc_"+un.id)}),kind:"€",have:m,need:unlockCost(un)});
  if(slots()<7) out.push({t:fmt("slot_g",{s:slots()+1}),kind:"xp",have:state.tx,need:XP[lvI+1]});
  if(repTier()<4) out.push({t:fmt("rep_g",{n:t("rp_"+(repTier()+1))}),kind:"rep",have:state.rep,need:nextRep()});
  return (list?list(out):out).slice(0,max||3);
}
function goalHTML(g){
  let val="";
  if(g.kind==="€"){ val = state.money>=g.need ? t("goal_ready") : fmt("eur_to_go",{x:g.need-g.have});}
  else if(g.kind==="xp")val=fmt("xp_to_go",{x:g.need-g.have>0?g.need-g.have:"0"});
  else if(g.kind==="rep")val=fmt("rep_to_go",{x:g.need-g.have>0?g.need-g.have:"0"});
  else val=fmt("lv_goal",{a:g.have,b:g.need});
  return `<div class="goal"><div class="lab">${g.t}</div><div class="val" style="color:${state.money>=g.need&&g.kind==="€"?"#2f7d43":""}">${val}</div></div>`;
}

/* ---------- contracts ---------- */
function destOf(i,dx){ const d=i+dx; return d>=0&&d<CITIES.length?d:null; }
function rClass(x){ return (x||"common").toLowerCase().replace(/[^a-z]/g,""); }
function repGainFor(c){ return Math.round(Math.max(1,c.dist*1.5)); }
function cxGainFor(c){ return Math.round(c.dist*2+6); }
function rerollCost(){ return Math.round(120*Math.pow(2,state.rerolls)); }
function pickRiskLabel(){ return ta("risk"+(state.pickRisk==="rush"?1:state.pickRisk==="danger"?2:0))[0]; }
function reroll(){
  if(!tutDone()&&inTutorial())return;
  if(state.contract!==null||state.specialSel){alert(t("reroll_impossible"));return;}
  const cost=rerollCost();
  if(state.money<cost){alert(fmt("reroll_broke",{c:cost}));return;}
  state.money-=cost;
  state.rerolls++; state.contracts=makeContracts();
  log(fmt("newroute",{c:cost})); save(); update(); contractTab();
}
function clearRoute(){ if(!tutDone()&&inTutorial())return; state.contract=null; state.specialSel=false; state.special=null; save(); log(t("route_dropped")); showTab(2); }
function rarityFor(cg){
 if(cg.prem) return cg.v>=280?"epic":"rare";
 if(cg.risky) return "rare";
 if(cg.v>=240) return "rare";
 if(cg.v>=120) return "uncommon";
 return "common";
}
function makeContracts(){
  const i=state.city, cap=capNow(), pool=[]; let used=new Set();
  const cl=cityLevel(i), tier=repTier();
  const cityMult=CITIES[i].mult||1;
  const cands=[];
  [1,-1,2,-2,3,-3,4,-4].forEach(dx=>{const d=destOf(i,dx); if(d!=null&&routeOpen(i,d))cands.push(d);});
  const sh=a=>a.slice().sort(()=>Math.random()-.5);
  CITIES[i].prod.forEach(p=>{
   const cg=CARGOES[p];
   if(!cands.length) return;
   const shuffle=sh(cands);
   const d=shuffle.find(x=>!used.has(x));
   if(d==null||d===i) return;
   used.add(d); const dist=Math.abs(d-i);
   const baseAmt=(cg.bulk?6:cg.perp?2.5:3)+Math.random()*2.5;
   const headroom=cl>=1&&cg.bulk?24:0;
   const amount=Math.max(1,Math.min(cap+headroom,Math.round(baseAmt*(1+(cg.bulk?0.9:0.3)*cl)*cityMult)));
   let need=null;
   if(cg.risky&&tier>=2&&Math.random()<0.5) need="tanker";
   if(p==="mail"&&tier>=2&&Math.random()<0.5) need="mailcar";
   const rarity=rarityFor(cg);
   const tierMult={common:1,uncommon:1.15,rare:1.35,epic:1.6,legendary:2}[rarity];
   const reward=Math.round(cg.v*amount*(1+dist*0.6)*(1+cl*0.12)*tierMult*cityMult);
   const deadline=(cg.prem||cg.risky||rarity==="epic"||rarity==="legendary")?Math.max(1,Math.round(travelH(dist)*0.82*10)/10):null;
   pool.push({cargo:p,to:d,dist,amount,reward,rarity,deadline,riskdist:dist,need});
  });
  if(tier>=2){
   const prem=CITIES[i].prod.filter(p=>CARGOES[p].prem||CARGOES[p].v>=240);
   if(prem.length){
    const p=prem[Math.floor(Math.random()*prem.length)], cg=CARGOES[p];
    const d=sh([destOf(i,2),destOf(i,1),destOf(i,-1)]).find(x=>x!=null&&!used.has(x)&&x!==i);
    if(d!=null){used.add(d);const dist=Math.abs(d-i);
     const amount=Math.max(1,Math.min(cap+14,2+Math.floor(Math.random()*2)+cl));
     const reward=Math.round(cg.v*amount*(1+dist*0.7)*1.35*(1+cl*0.12)*cityMult);
     pool.push({cargo:p,to:d,dist,amount,reward,rarity:"rare",deadline:Math.max(1,Math.round(travelH(dist)*0.8*10)/10),riskdist:dist,need:null});}
   }
  }
  if(tier>=3&&!used.has(3)){
   const d=destOf(i,2)||destOf(i,1)||destOf(i,3);
   if(d!=null&&!used.has(d)){used.add(d);const dist=Math.abs(d-i);
    const amount=Math.max(1,Math.min(cap+10,5+cl));
    const reward=Math.round(CARGOES.luxury.v*amount*(1+dist*0.7)*1.6*(1+cl*0.12)*cityMult);
    pool.push({cargo:"luxury",to:d,dist,amount,reward,rarity:"epic",deadline:Math.max(1,Math.round(travelH(dist)*0.8*10)/10),riskdist:dist,need:"armored"});}
  }
  if((tier>=4||cl>=3)&&cap>=2){
   const p="luxury",cg=CARGOES.luxury;
   const d=destOf(i,3); if(d!=null&&!used.has(d)){used.add(d);
    const amount=Math.max(2,Math.min(cap,3+Math.floor(cl/2)));
    const reward=Math.round(cg.v*amount*(1+3*0.7)*2*cityMult);
    pool.push({cargo:p,to:d,dist:3,amount,reward,rarity:"legendary",deadline:Math.max(1,Math.round(travelH(3)*0.8*10)/10),riskdist:3,need:null});}
  }
  if(cl>=3&&tier>=2){
   const highVal=["electronics","machinery","luxury","passengers"].filter(p=>CITIES[i].prod.includes(p));
   if(highVal.length){
    const p=highVal[Math.floor(Math.random()*highVal.length)], cg=CARGOES[p];
    const d=sh([destOf(i,3),destOf(i,4)]).find(x=>x!=null&&!used.has(x)&&x!==i);
    if(d!=null){used.add(d);const dist=Math.abs(d-i);
     const amount=Math.max(1,Math.min(cap+6,2+Math.floor(Math.random()*2)));
     const reward=Math.round(cg.v*amount*(1+dist*0.8)*1.8*cityMult);
     pool.push({cargo:p,to:d,dist,amount,reward,rarity:"legendary",deadline:Math.max(1,Math.round(travelH(dist)*0.75*10)/10),riskdist:dist,need:null});}
   }
  }
  pool.sort((a,b)=>b.reward-a.reward);
  return pool.slice(0,7);
}

/* ---------- special delivery (line-unlock, the "big win") ---------- */
function specialReady(){
  const k=nextLockedLine(); if(k<0) return null;
  const u=LINEUNLOCK[k]; if(!u) return null;
  const open=LINE[k].filter(i=>!state.discovered[i]);
  if(!open.length) return null;
  const lo=LINE[k][0], hi=LINE[k][LINE[k].length-1];
  const need=u.k==="w"?{k:"w",id:u.id}:{k:"e",idx:u.idx};
  return {line:k,to:hi,from:lo,open,need,lv:u.lv,deliv:u.deliv||0};
}
function buildSpecial(){
  const r=specialReady(); if(!r) return null;
  const u=r.need, loc=u.k==="w"?WAGONS.find(w=>w.id===u.id):ENGINES[u.idx];
  const reward=Math.round((u.k==="w"?loc.up:loc.price)*(r.open.length*0.9+0.5));
  const nextLine=r.line;
  return {line:r.line,to:r.to,from:r.from,open:r.open,cargo:"gold",amount:Math.max(2,Math.round(loc.cap||10)*0.2),reward,dist:Math.max(3,r.to-r.from+1),need:{k:u.k,idx:u.idx,id:u.k==="w"?u.id:ENGINES[u.idx].id},idx:u.idx,lv:r.lv,deliv:r.deliv};
}
function refreshSpecial(){

/* ---------- journey ---------- */
function go(){
 if(!tutDone()&&inTutorial()&&tutStep()==="go"){nextTutorialStep();} else if(!tutDone()&&inTutorial())return;
 const sp=state.specialSel&&state.special;
 if(!sp){ if(state.contract===null)return; }
 const c=sp?sp:(state.contracts[state.contract]);
 if(!c)return;
 if(!sp){
  if(c.need&&!hasW(c.need)){alert(fmt("go_need",{i:WAGONS.find(w=>w.id===c.need).ic,n:t("wc_"+c.need)}));return;}
  if(overCap(c)){alert(t("go_cap"));return;}
 }
 if(overPull()){alert(fmt("go_pull",{a:weight(),e:t("eg_"+eng().id),b:pullNow()}));return;}
 if(state.money<opCost()){alert(fmt("go_cash",{c:opCost()}));return;}
  state.money-=opCost();
  const mult=sp?1:(state.pickRisk==="rush"?1.25:state.pickRisk==="danger"?1.75:1);
   const cc=sp?{to:c.to,dist:c.dist,deadline:null,cargo:c.cargo,amount:c.amount,reward:c.reward,open:c.open,need:c.need.k==="w"?c.need.id:null}:c;
 const evList=inTutorial()&&tutStep()==="event"?
  [{t:t("ev_mech_n"),d:t("ev_mech_d"),o:[{l:t("ev_mech_a"),g:-100},{l:t("ev_mech_b"),g:40,f:-240,odds:0.5}]}]
  :buildEvents(cc.dist,cc.cargo);
 state.active={contract:cc,mult,evs:evList,idx:0,deadlineH:cc.deadline,travelH:travelH(cc.dist),late:false,special:!!sp};
 state.trip={gain:0,rep:0,failed:false,handled:0};
 state.outcome=null; state.departed=true; save(); update(); showTab(2);
}
function pick(i){
 if(!tutDone()&&inTutorial()&&tutStep()==="event"){ if(i!==0)return; nextTutorialStep(); }
 const j=state.active, e=j.evs[j.idx], o=e.o[i];
 const r={out:"calm",g:0,it:0};
 if(o.odds==null){ r.g=o.g; r.out=o.g>0?"bonus":o.g<0?"paid":"calm"; }
 else{ r.it=Math.random()<o.odds?1:0; if(r.it){r.g=o.g; r.out=o.g>0?"bonus":"calm";} else {r.g=o.f; r.out="loss"; state.trip.failed=true; } }
 state.trip.gain+=r.g; state.trip.handled++;
 state.outcome=r; save(); showTab(2);
}
function step(){
 const j=state.active; j.idx++;
 if(j.idx>=j.evs.length){ arrive(); } else { state.outcome=null; save(); showTab(2); }
}
function arrive(){
  const j=state.active, special=!!j.special, c=j.contract, trip=state.trip, from=state.city;
  const good=special?!trip.failed:!(trip.failed||j.late), mult=j.mult;
  const base=special?c.reward:Math.round(c.reward*mult*cargoBonus(c));
  const oldCl=cityLevel(c.to);
  state.cx[c.to]+=Math.round((c.dist*2+(good?6:0))*mult);
  const latePen=good?0:Math.round(base*0.3);
  const rarityPenalty={"common":1,"uncommon":1.3,"rare":1.7,"epic":2.5,"legendary":4}[c.rarity]||1;
  const failBaseMult=good?1:special?0.6:0.1;
  const net=good?base+trip.gain:Math.max(0,Math.round(base*failBaseMult*(special?1:rarityPenalty)))-latePen+Math.max(0,trip.gain);
  state.money+=net;
  const repCh=good?Math.round(c.dist*1.2*mult):-Math.max(2,Math.round((c.dist*1.5+3)*rarityPenalty));
  state.rep=Math.max(0,state.rep+repCh);
 const xpGain=special?Math.round(c.dist*30):Math.round(c.reward/10)+c.dist*4;
 const txBefore=state.tx, lvBefore=lvNow();
 state.tx+=xpGain;
 const st=state.stats; st.deliv++; st.cargo+=c.amount;
 const cg=CARGOES[c.cargo];
 if(cg&&cg.prem)st.premDel++;
 if(c.dist>=3)st.long++;
 if((from<=2&&c.to>=3)||(from>=3&&c.to<=2))st.cross++;
 if(c.rarity==="legendary")st.legend++;
 if(!j.late&&good)st.streak++; else st.streak=0; st.best=Math.max(st.best,st.streak);
  const newCities=special?(c.open||[]).filter(k=>!state.discovered[k]):(!state.discovered[c.to]?[c.to]:[]);
  newCities.forEach(k=>state.discovered[k]=true);
  state.city=c.to;
  const townUp=cityLevel(c.to)>oldCl;
 let news=[];
  if(newCities.length)news.push(fmt("g_newline",{n:newCities.map(k=>CITIES[k].i+" "+CITIES[k].n).join(" · ")}));
  if(townUp)news.push(fmt("g_grow",{n:CITIES[c.to].n,l:["Ⅰ","Ⅱ","Ⅲ"][cityLevel(c.to)]}));
  ACH.forEach(a=>{ if(!state.ach.includes(a.id)&&a.c()){state.ach.push(a.id); if(a.perk)a.perk(); state.money+=a.rw; news.push(fmt("g0",{n:t("ach_"+a.id),r:a.rw})); }});
  CH.forEach((ch,i)=>{ if(i===state.chapter&&ch.c()){state.chapter=i+1; state.money+=ch.rw; state.rep+=ch.rep; news.push(fmt("g_chap",{t:t("ch_"+i)})); }});
  log(fmt(good?"log_good":"log_part",{c:t("cg_"+c.cargo),a:c.amount,to:CITIES[c.to].n,n:net,r:(repCh>=0?"+":"")+repCh}));
  state.result={good,cargo:t("cg_"+c.cargo)+" ×"+c.amount,to:CITIES[c.to].n,dist:c.dist,base,bonus:special?1:cargoBonus(c),routeMult:j.mult,gain:trip.gain,handled:trip.handled,net,repChange:repCh,rep:state.rep,late:j.late,news,special,xpGain,lvBefore,txBefore,leveledUp:lvNow()>lvBefore,newLv:LV()};
  state.contract=null; state.active=null; state.trip=null; state.pickRisk="normal"; state.outcome=null; state.rerolls=0;
  if(special){ state.specialSel=false; state.special=null; }
  state.contracts=makeContracts();
  save(); update(); showTab(2);
}
function clearResult(){ clearResultTimer(); state.result=null; save(); update(); showTab(2); }

function cargoBonus(c){
 const cg=CARGOES[c.cargo]; let m=1;
 eq().forEach(w=>{
  if(w.b=== "bulk"&&cg.bulk)m+=0.25;
  if(w.b==="prem"&&cg.prem)m+=0.30;
  if(w.b==="perp"&&cg.perp)m+=0.30;
  if(w.b==="risky"&&cg.risky)m+=0.25;
 });
 if(cg.prem&&state.perkCourier)m+=0.10;
 return m;
}

  const un=WAGONS.filter(w=>w.price>0&&!ownedCount(w.id)).sort((a,b)=>unlockCost(a)-unlockCost(b))[0];
  let cand=[];
  if(nextE){
    const need=lv<nextE.lv?{k:"lv",have:lv,need:nextE.lv,label:t("eg_"+nextE.id)}
                        :{k:"€",have:m,need:nextE.price,label:t("eg_"+nextE.id)};
    cand.push({label:t("eg_"+nextE.id),kind:need.k,have:need.have,need:need.need});
  }
  if(un){
    const need=lv<un.lv?{have:lv,need:un.lv}:{have:m,need:unlockCost(un)};
    cand.push({label:un.ic+" "+t("wc_"+un.id),kind:lv<un.lv?"lv":"€",have:need.have,need:need.need});
  }
  cand.sort((a,b)=>a.need-a.need);
  const g=cand[0];
  if(!g) return `<span class="hud-done">${t("hud_done")}</span>`;
  const ready=g.kind==="€"?m>=g.need:lv>=g.need;

                       :fmt("lv_goal",{a:g.have,b:g.need});

}

/* ---------- journey animation ---------- */
let jiv=null;
function kancel(){ if(jiv!=null&&typeof cancelAnimationFrame==="function")cancelAnimationFrame(jiv); jiv=null; }

function drawScene(p,phase){
 const cv=pixA("jcan"); if(!cv)return;
 const jj=state.active; if(!jj)return;
 const scale=2, tr=trainRows(), dist=jj.contract.dist, n=jj.evs.length;
 const TW=trackW(dist), tTop=26, trainH=tr.H;
 const pad=12, range=TW-pad*2-tr.W*scale;
 const xT=Math.round(pad+p*range);
 const hillsY=tTop+trainH+1, railY=hillsY+11, H=railY+4;
 cv.width=TW*scale; cv.height=H*scale;
 const x=cv.getContext("2d"); if(!x||typeof x.fillRect!=="function")return;
 x.fillStyle="#0e1428"; x.fillRect(0,0,TW*scale,cv.height);
 x.fillStyle="#131a30"; x.fillRect(0,0,TW*scale,13*scale);
 x.fillStyle="#192038"; x.fillRect(0,13*scale,TW*scale,(hillsY-13)*scale);
 x.fillStyle="#e5eaf6"; for(let i=0;i<48;i++){ if(i%3===0)continue; const sx=(i*97+37)%TW, sy=(i*83+(i*17)%5)%11; x.fillRect(sx*scale,sy*scale,scale,scale); }
 const drift=Math.floor(phase*12)%TW;
 for(let j=0;j<3;j++){
  const cy=5+j*4, base=((j*173+drift*3)%TW);
  x.fillStyle="rgba(128,141,163,0.28)";
  for(let c2=0;c2<3;c2++) x.fillRect(((base+c2*3)%TW)*scale,(cy+(c2%2))*scale,(c2===1?5:3)*scale,scale);
 }
 for(let wx=0;wx<TW;wx++){
  const bump=(((wx+Math.floor(phase*14))%9)<2?2:0);
  x.fillStyle="#232c48"; x.fillRect(wx*scale,hillsY*scale,scale,(5+bump)*scale);
 }
 x.fillStyle="#1b2338"; x.fillRect(0,(hillsY+6)*scale,TW*scale,3*scale);
 for(let k=0;k<=n;k++){
  const mx=Math.round((k+1)/(n+1)*TW);
  const isPending=!state.outcome&&k===jj.idx;
  const isDone=state.outcome?k<=jj.idx:k<jj.idx;
  x.fillStyle="#465166"; x.fillRect(mx*scale,(railY-3)*scale,Math.max(1,Math.round(scale/2)),4*scale);
  x.fillStyle=isDone?"#43a047":isPending?(Math.floor(phase)%2?"#f5d742":"#8a6d1a"):"#3a4352";
  x.fillRect(mx*scale-1,(railY-4)*scale,3*scale,2*scale);
 }
 if(state.outcome){ // burst at the last resolved marker
  const o=state.outcome, mx=Math.round((jj.idx+1)/(n+1)*TW), my=railY*scale;
  x.fillStyle=o.out==="loss"?"#c62828":o.out==="bonus"?"#67d17e":"#b0bec5";
  x.fillRect(mx*scale-2*scale,my,5*scale,2*scale); x.fillRect(mx*scale,my-2*scale,2*scale,5*scale);
 }
 const bob=Math.floor(phase)%2;
 for(let y=0;y<trainH;y++)for(let c=0;c<tr.W;c++){ if(!tr.g[y][c])continue; x.fillStyle=tr.g[y][c]; x.fillRect((c*scale+xT),(y+tTop+bob)*scale,scale,scale); }
 const cabX=xT+(tr.W-18+3)*scale;
 for(let i=0;i<8;i++){ const s=Math.floor(phase*2.2+i*1.4)%11; const px=cabX+i*2*scale+Math.floor(Math.sin(i+phase*6)*2)*scale; const py=(tTop-1-s)*scale; const sz=Math.max(scale,6-s); x.fillStyle=i===0?"#c6ccd4":"rgba(143,152,163,0.9)"; x.fillRect(px,py,sz,sz); }
 x.fillStyle="#0e1217"; x.fillRect(0,railY*scale,TW*scale,scale);
 x.fillStyle="#232a33"; x.fillRect(0,(railY+1)*scale,TW*scale,scale);
 x.fillStyle="#39414c"; for(let i=0;i<TW;i++){ if(i%2)x.fillRect(i*scale,(railY+1)*scale,scale,Math.floor(scale*0.7)); }
 x.fillStyle="#141a24"; x.fillRect(0,(railY+2)*scale,TW*scale,(H-(railY+2))*scale);
}
function animateScene(){
 const jj=state.active; if(!jj)return;
 if(state.outcome){ drawScene(1,3); return; }
 const n=jj.evs.length;
 const legStart=jj.idx===0?0:(jj.idx)/(n+1);
 const legEnd=(jj.idx+1)/(n+1);
 const dur=Math.max(2.4,Math.min(5.4,2.4+jj.contract.dist*0.9));
 const t0=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
 function tick(){
  if(!state.active){ kancel(); return; }
  const now=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  const p=Math.min(1,(now-t0)/(dur*1000));
  const phase=Math.floor(p*dur*6);
  drawScene(legStart+p*(legEnd-legStart),phase);
  if(p>=1){ kancel(); const el=document.getElementById("jbubble"); if(el&&document.body&&typeof el.classList!=="undefined")el.classList.add("arrived"); return; }
  if(typeof requestAnimationFrame==="function")jiv=requestAnimationFrame(tick);
 }
 if(typeof requestAnimationFrame==="function"){ jiv=requestAnimationFrame(tick); } else { drawScene(1,3); }
}
function renderJourney(){

let tutTargetRef=null, tutSpotRef=null, tutTipRef=null, tutArrowRef=null, tutMaxW=340;
function placeTutorTip(){
 const tgt=tutTargetRef, tip=tutTipRef, spot=tutSpotRef, arrow=tutArrowRef;
 if(!tgt||!tip||!spot)return;
 const r=tgt.getBoundingClientRect();
 const vw=window.innerWidth||0, vh=window.innerHeight||0, pad=12;
 const maxW=Math.min(tutMaxW,vw?vw-pad*2:tutMaxW);
 tip.style.maxWidth=maxW+"px";
 const tw=tip.offsetWidth||maxW, th=tip.offsetHeight||0;
 const below=!vh||r.bottom+th+pad<=vh;
 let top=below?r.bottom+pad:Math.max(pad,r.top-th-pad);
 if(!below&&vh&&top+th>vh-pad) top=Math.max(pad,vh-th-pad);
 let left=pad;
 if(vw){
  left=Math.max(pad,Math.min(r.right+pad,vw-tw-pad));
  if(left+tw>vw-pad) left=Math.max(0,vw-tw-pad);
 }
 tip.style.left=left+"px"; tip.style.top=top+"px";
 const room=(below?vh-(r.bottom+pad):r.top-top)-pad;
 tip.style.maxHeight=Math.max(70,room)+"px"; tip.style.overflowY="auto";
 spot.style.left=(r.left-4)+"px"; spot.style.top=(r.top-4)+"px";
 spot.style.width=(r.width+8)+"px"; spot.style.height=(r.height+8)+"px";
 if(arrow){
  arrow.style.left=(r.left+r.width/2-12)+"px";
  arrow.style.top=(below?(r.bottom-6):(r.top-28))+"px";
  arrow.textContent=below?"⬇":"⬆";
 }
}
